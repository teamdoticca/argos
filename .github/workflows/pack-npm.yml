name: pack-npm

# Pack/publish @teamdoticca/argos when package-relevant paths change.
on:
  push:
    branches: [master, main]
    paths:
      - "crates/**"
      - "bindings/npm/**"
      - ".github/workflows/pack-npm.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/verify.yml"
      - "scripts/verify.ps1"
      - "scripts/enter-msvc.ps1"
      - "rust-toolchain.toml"
      - "LICENSE"
      - "fixtures/**"
  pull_request:
    paths:
      - "crates/**"
      - "bindings/npm/**"
      - ".github/workflows/pack-npm.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/verify.yml"
      - "scripts/verify.ps1"
      - "scripts/enter-msvc.ps1"
      - "rust-toolchain.toml"
      - "LICENSE"
      - "fixtures/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after build + smoke"
        type: boolean
        default: false
      registry:
        description: "Publish target (github Packages dogfood vs public npmjs)"
        type: choice
        options:
          - github
          - npmjs
          - both
        default: github

concurrency:
  group: pack-npm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_file: argos.win32-x64-msvc.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_file: argos.linux-x64-gnu.node
          - os: macos-latest
            target: aarch64-apple-darwin
            node_file: argos.darwin-arm64.node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install npm deps
        working-directory: bindings/npm
        run: npm ci

      - name: Build native addon
        working-directory: bindings/npm
        run: npm run build -- --target ${{ matrix.target }}

      - name: Smoke Open scopes
        working-directory: bindings/npm
        run: npm run smoke

      - name: Smoke Watch on Node 24
        working-directory: bindings/npm
        run: npm run smoke:watch

      - name: Verify npm archive contents
        working-directory: bindings/npm
        shell: bash
        run: |
          npm pack --dry-run --json --silent > "$RUNNER_TEMP/argos-pack.json"
          node check-package.mjs "$RUNNER_TEMP/argos-pack.json"

      - name: Switch to Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Smoke Open on Node 22
        working-directory: bindings/npm
        run: npm run smoke

      - name: Watch smoke (Windows)
        if: runner.os == 'Windows'
        working-directory: bindings/npm
        shell: pwsh
        run: node smoke-watch.mjs

      - name: Watch smoke (Unix)
        if: runner.os != 'Windows'
        working-directory: bindings/npm
        run: node smoke-watch.mjs

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: argos-node-${{ matrix.target }}
          path: |
            bindings/npm/${{ matrix.node_file }}
            bindings/npm/binding.js
            bindings/npm/binding.d.ts
          if-no-files-found: error
          retention-days: 14

  publish-github:
    name: Publish GitHub Packages
    needs: [build, verify]
    if: >
      github.repository == 'teamdoticca/argos'
      && github.event_name == 'workflow_dispatch'
      && inputs.publish
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (inputs.registry == 'github' || inputs.registry == 'both')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@teamdoticca"

      - name: Download natives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts/npm
          pattern: argos-node-*
          merge-multiple: true

      - name: Stage natives into package
        working-directory: bindings/npm
        run: |
          cp -f ../../artifacts/npm/*.node .
          if [ -f ../../artifacts/npm/binding.js ]; then cp -f ../../artifacts/npm/binding.js .; fi
          if [ -f ../../artifacts/npm/binding.d.ts ]; then cp -f ../../artifacts/npm/binding.d.ts .; fi
          ls -la *.node

      - name: Install npm deps
        working-directory: bindings/npm
        run: npm ci

      - name: Bump CI prerelease version
        working-directory: bindings/npm
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          VER="${BASE}-ci.${GITHUB_RUN_NUMBER}"
          npm version "$VER" --no-git-tag-version
          echo "NPM_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Publish (restricted, GitHub Packages)
        working-directory: bindings/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prerelease versions require an explicit --tag; dogfood feed should still move `latest`.
          npm publish --access restricted --tag latest --registry https://npm.pkg.github.com

      - name: Summary
        run: |
          echo "## @teamdoticca/argos → GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${NPM_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dist-tag: \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry: https://npm.pkg.github.com" >> "$GITHUB_STEP_SUMMARY"

  publish-npmjs:
    name: Publish npmjs.org
    needs: [build, verify]
    # Explicit only — never auto-publish CI builds to the public registry.
    if: >
      github.event_name == 'workflow_dispatch'
      && (inputs.publish == true || inputs.publish == 'true')
      && (inputs.registry == 'npmjs' || inputs.registry == 'both')
      && github.repository == 'teamdoticca/argos'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: npmjs
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@teamdoticca"

      - name: Download natives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts/npm
          pattern: argos-node-*
          merge-multiple: true

      - name: Stage natives into package
        working-directory: bindings/npm
        run: |
          cp -f ../../artifacts/npm/*.node .
          if [ -f ../../artifacts/npm/binding.js ]; then cp -f ../../artifacts/npm/binding.js .; fi
          if [ -f ../../artifacts/npm/binding.d.ts ]; then cp -f ../../artifacts/npm/binding.d.ts .; fi
          npm run check:natives
          ls -la *.node

      - name: Install npm deps
        working-directory: bindings/npm
        run: npm ci

      - name: Use release version (no -ci suffix)
        working-directory: bindings/npm
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          npm version "$BASE" --no-git-tag-version --allow-same-version
          echo "NPM_VERSION=$BASE" >> "$GITHUB_ENV"

      - name: Publish (public, npmjs)
        working-directory: bindings/npm
        run: npm publish --access public --provenance --registry https://registry.npmjs.org/

      - name: Summary
        run: |
          echo "## @teamdoticca/argos → npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${NPM_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Install: \`npm install @teamdoticca/argos\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release guide: docs/RELEASING.md" >> "$GITHUB_STEP_SUMMARY"
