name: pack-nuget

# Pack/publish only when package-relevant paths change (docs-only pushes skip this workflow).
# Manual: workflow_dispatch. Release pin: tag v*.
# nuget.org: explicit dispatch only (Trusted Publishing OIDC) — never auto on main.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "bindings/nuget/**"
      - "scripts/pack-nuget.ps1"
      - ".github/workflows/pack-nuget.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "rust-toolchain.toml"
      - ".github/workflows/verify.yml"
      - "scripts/verify.ps1"
      - "scripts/enter-msvc.ps1"
      - "fixtures/**"
  pull_request:
    paths:
      - "crates/**"
      - "bindings/nuget/**"
      - "scripts/pack-nuget.ps1"
      - ".github/workflows/pack-nuget.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "rust-toolchain.toml"
      - ".github/workflows/verify.yml"
      - "scripts/verify.ps1"
      - "scripts/enter-msvc.ps1"
      - "fixtures/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after pack + smoke"
        type: boolean
        default: false
      registry:
        description: "Publish target (GitHub Packages dogfood vs public nuget.org)"
        type: choice
        options:
          - github
          - nugetorg
          - both
        default: github

concurrency:
  group: pack-nuget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REQUIRED_RIDS: "win-x64,osx-arm64,linux-x64,osx-x64,linux-arm64"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build-native:
    timeout-minutes: 25
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            native_name: argos_ffi.dll
          - rid: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            native_name: libargos_ffi.so
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            native_name: libargos_ffi.so
          - rid: osx-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            native_name: libargos_ffi.dylib
          - rid: osx-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            native_name: libargos_ffi.dylib
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.rust_target }}

      - name: Build argos-ffi
        shell: bash
        run: cargo build -p argos-ffi --locked --release --target "${{ matrix.rust_target }}"

      - name: Stage RID native
        shell: bash
        run: |
          set -euo pipefail
          src="target/${{ matrix.rust_target }}/release/${{ matrix.native_name }}"
          if [[ ! -f "$src" ]]; then
            echo "missing cargo artifact: $src" >&2
            ls -la "target/${{ matrix.rust_target }}/release/" || true
            exit 1
          fi
          dest="stage/${{ matrix.rid }}/native"
          mkdir -p "$dest"
          cp -f "$src" "$dest/${{ matrix.native_name }}"
          ls -la "$dest"

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Upload parent so artifact root is <rid>/native/<file> (merge-friendly).
          name: native-${{ matrix.rid }}
          path: stage
          if-no-files-found: error
          retention-days: 14

  pack:
    name: Pack multi-RID nupkg
    needs: build-native
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.version.outputs.version }}
      nupkg_name: ${{ steps.version.outputs.nupkg }}
      base_version: ${{ steps.packver.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download native RID artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*
          path: artifacts/natives
          merge-multiple: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Resolve pack version
        id: packver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $csproj = "bindings/nuget/Argos/Argos.csproj"
          $raw = Get-Content $csproj -Raw
          if ($raw -notmatch '<Version>([^<]+)</Version>') {
            throw "Version missing in $csproj"
          }
          $base = $Matches[1].Trim()

          $version = $base
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          }
          elseif (
            $env:GITHUB_EVENT_NAME -eq 'push' -and
            ($env:GITHUB_REF -eq 'refs/heads/main' -or $env:GITHUB_REF -eq 'refs/heads/master')
          ) {
            $version = "$base.$env:GITHUB_RUN_NUMBER"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $version = "$base-pr.$env:GITHUB_RUN_NUMBER"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "base=$base" >> $env:GITHUB_OUTPUT
          Write-Host "Pack version: $version (base=$base)"

      - name: Pack NuGet (multi-RID)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $require = @($env:REQUIRED_RIDS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          ./scripts/pack-nuget.ps1 `
            -SkipBuild `
            -StageFrom "artifacts/natives" `
            -RequireRids $require `
            -Version "${{ steps.packver.outputs.version }}"

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nupkg = Get-ChildItem artifacts/nuget -Filter "Argos.*.nupkg" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $nupkg) { throw "nupkg missing after pack" }
          if ($nupkg.BaseName -notmatch '^Argos\.(.+)$') {
            throw "unexpected nupkg name $($nupkg.Name)"
          }
          $version = $Matches[1]
          $expected = "${{ steps.packver.outputs.version }}"
          if ($version -ne $expected) {
            throw "nupkg version '$version' != pack version '$expected'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "nupkg=$($nupkg.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved Argos $version ($($nupkg.Name))"

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: argos-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 14

  smoke-rid:
    name: smoke ${{ matrix.tfm }} ${{ matrix.rid }}
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net9.0, net10.0]
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
          # osx-x64 native is built + verified inside the nupkg (RequireRids).
          # Dedicated Intel Mac runners (macos-13) queue too long for PR smoke.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: argos-nuget
          path: artifacts/nuget

      - name: Setup selected .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ matrix.tfm == 'net8.0' && '8.0.x' || matrix.tfm == 'net9.0' && '9.0.x' || '10.0.x' }}

      - name: Smoke PackageReference + watch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.pack.outputs.package_version }}"
          $rid = "${{ matrix.rid }}"
          $tfm = "${{ matrix.tfm }}"
          if ([string]::IsNullOrWhiteSpace($version)) { throw "package version output missing" }
          Push-Location bindings/nuget/smoke
          try {
            dotnet restore Argos.Smoke.csproj -p:ArgosPackageVersion=$version -p:RuntimeIdentifier=$rid -p:TargetFramework=$tfm
            if ($LASTEXITCODE -ne 0) { throw "restore failed" }
            $fixture = (Resolve-Path "..\..\..\fixtures\small-pnpm").Path
            dotnet run --framework $tfm -c Release --no-restore -p:ArgosPackageVersion=$version -p:RuntimeIdentifier=$rid -- $fixture
            if ($LASTEXITCODE -ne 0) { throw "open smoke failed" }
            dotnet run --framework $tfm -c Release --no-restore -p:ArgosPackageVersion=$version -p:RuntimeIdentifier=$rid -- --watch
            if ($LASTEXITCODE -ne 0) { throw "watch smoke failed" }
          }
          finally {
            Pop-Location
          }

  publish-github-packages:
    name: Publish GitHub Packages
    needs: [pack, smoke-rid, verify]
    if: >
      github.repository == 'teamdoticca/argos'
      && github.event_name == 'workflow_dispatch'
      && inputs.publish
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (inputs.registry == 'github' || inputs.registry == 'both')
    timeout-minutes: 15
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: argos-nuget
          path: artifacts/nuget

      - name: Setup .NET 8 (GitHub Packages auth)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.x"
          source-url: https://nuget.pkg.github.com/teamdoticca/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "https://nuget.pkg.github.com/teamdoticca/index.json"
          $nupkgs = @(Get-ChildItem artifacts/nuget -Filter "Argos.*.nupkg")
          if ($nupkgs.Count -eq 0) { throw "no nupkg downloaded for publish" }

          foreach ($pkg in $nupkgs) {
            Write-Host "Pushing $($pkg.FullName) -> $source"
            & dotnet nuget push $pkg.FullName `
              --source $source `
              --api-key $env:NUGET_AUTH_TOKEN `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $($pkg.Name) (exit $LASTEXITCODE)"
            }
          }

          Write-Host "Published: $($nupkgs.Name -join ', ')"
          Write-Host "Consume feed: $source"
          Write-Host "PackageReference: <PackageReference Include=`"Argos`" Version=`"${{ needs.pack.outputs.package_version }}`" />"

      - name: Job summary
        shell: pwsh
        run: |
          @"
          ## Argos → GitHub Packages

          - **Version:** `${{ needs.pack.outputs.package_version }}`
          - **File:** `${{ needs.pack.outputs.nupkg_name }}`
          - **RIDs:** win-x64, osx-arm64, osx-x64, linux-x64, linux-arm64 (glibc)
          - **Feed:** `https://nuget.pkg.github.com/teamdoticca/index.json`
          - **Org packages:** https://github.com/orgs/teamdoticca/packages

          Publication requires explicit dispatch from the default branch.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

  publish-nuget-org:
    name: Publish nuget.org
    needs: [pack, smoke-rid, verify]
    # Explicit only — never auto-publish CI 4-part versions to the public gallery.
    if: >
      github.event_name == 'workflow_dispatch'
      && (inputs.publish == true || inputs.publish == 'true')
      && (inputs.registry == 'nugetorg' || inputs.registry == 'both')
      && github.repository == 'teamdoticca/argos'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    environment: nugetorg
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download native RID artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*
          path: artifacts/natives
          merge-multiple: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.x"

      - name: Resolve exact public version
        id: pubver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packed = "${{ needs.pack.outputs.package_version }}"
          $base = "${{ needs.pack.outputs.base_version }}"
          if ([string]::IsNullOrWhiteSpace($base)) {
            $raw = Get-Content bindings/nuget/Argos/Argos.csproj -Raw
            if ($raw -notmatch '<Version>([^<]+)</Version>') { throw "Version missing" }
            $base = $Matches[1].Trim()
          }
          if ($packed -eq $base) {
            $version = $packed
            $needRepack = 'false'
          } else {
            Write-Host "Packed version $packed differs from base $base — re-packing for nuget.org"
            $version = $base
            $needRepack = 'true'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "need_repack=$needRepack" >> $env:GITHUB_OUTPUT
          Write-Host "nuget.org version: $version (repack=$needRepack)"

      - name: Download packed nupkg
        if: steps.pubver.outputs.need_repack != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: argos-nuget
          path: artifacts/nuget

      - name: Re-pack exact base for nuget.org (multi-RID)
        if: steps.pubver.outputs.need_repack == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force artifacts/nuget -ErrorAction SilentlyContinue
          $require = @($env:REQUIRED_RIDS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          ./scripts/pack-nuget.ps1 `
            -SkipBuild `
            -StageFrom "artifacts/natives" `
            -RequireRids $require `
            -Version "${{ steps.pubver.outputs.version }}"

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish (public, nuget.org)
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NUGET_API_KEY missing — check Trusted Publishing policy + secrets.NUGET_USER"
          }
          $nupkgs = @(Get-ChildItem artifacts/nuget -Filter "Argos.*.nupkg")
          if ($nupkgs.Count -eq 0) { throw "no nupkg for nuget.org publish" }
          $source = "https://api.nuget.org/v3/index.json"
          foreach ($pkg in $nupkgs) {
            Write-Host "Pushing $($pkg.Name) -> nuget.org"
            & dotnet nuget push $pkg.FullName `
              --source $source `
              --api-key $env:NUGET_API_KEY `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $($pkg.Name) (exit $LASTEXITCODE)"
            }
          }

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## Argos → nuget.org

          - **Version:** `${{ steps.pubver.outputs.version }}`
          - **Install:** ``dotnet add package Argos --version ${{ steps.pubver.outputs.version }}``
          - **Gallery:** https://www.nuget.org/packages/Argos
          - **RIDs:** win-x64, osx-arm64, osx-x64, linux-x64, linux-arm64 (glibc)
          - **Auth:** Trusted Publishing (OIDC) via ``NuGet/login@v1``
          - **Prep:** ``docs/done/m19-nuget-org-publish/nugetorg-prep.md``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
