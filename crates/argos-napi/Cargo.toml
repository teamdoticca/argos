[package]
name = "argos-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Argos Node-API (napi-rs) bindings for TypeScript/JavaScript"

[lib]
crate-type = ["cdylib"]

[dependencies]
argos-core = { workspace = true }
argos-backend = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2"
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(windows)'.dependencies]
argos-backend-windows = { path = "../argos-backend-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
argos-backend-linux = { path = "../argos-backend-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
argos-backend-macos = { path = "../argos-backend-macos" }

[build-dependencies]
napi-build = "2"

[package.metadata.napi]
name = "argos"
triples = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
